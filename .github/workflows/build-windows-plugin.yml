name: Build Windows Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-windows-plugin.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone OpenRGB release_1.0
        shell: bash
        run: |
          cd plugin/src/windows
          git clone --depth 1 --branch release_1.0 https://github.com/CalcProgrammer1/OpenRGB.git OpenRGB
          echo "OpenRGB commit: $(git -C OpenRGB rev-parse --short HEAD)"
          ls -la OpenRGB/dependencies/hidapi-win/x64/ || ls -la OpenRGB/dependencies/ || true

      - name: Place JSON where moc can find it
        shell: bash
        run: |
          cd plugin/src/windows
          # moc looks relative to the header file location and/or current dir
          cp -f OpenRGBTAC75HEPlugin.json ../common/
          cp -f OpenRGBTAC75HEPlugin.json .
          # also put a copy in the build dir later
          ls -la *.json ../common/*.json

      - name: Build plugin
        shell: cmd
        run: |
          cd plugin\src\windows
          if exist build rmdir /s /q build
          mkdir build
          copy /Y OpenRGBTAC75HEPlugin.json build\
          cd build
          qmake ..\OpenRGBTAC75HEPlugin.pro CONFIG+=release
          nmake

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find plugin -name "OpenRGBTAC75HEPlugin.dll" -exec cp -v {} dist/ \;
          # hidapi
          find plugin/src/windows/OpenRGB/dependencies/hidapi-win -name "hidapi.dll" -exec cp -v {} dist/ \; || true
          # also from DESTDIR
          cp -v plugin/bin/windows/* dist/ 2>/dev/null || true
          ls -la dist/
          echo "=== strings check ==="
          strings dist/OpenRGBTAC75HEPlugin.dll | grep -E "OpenRGBPluginAPIVersion|org.openrgb.tac75heplugin|MetaData|Akko TAC75" || echo "WARNING: metadata strings not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBTAC75HEPlugin-windows
          path: dist/
          if-no-files-found: error
