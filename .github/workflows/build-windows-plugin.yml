name: Build Windows Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-windows-plugin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check version consistency
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("plugin/src/common/OpenRGBTAC75HEPlugin.json"))["Version"])')"
          grep -Eq "info\\.Version[[:space:]]*=[[:space:]]*\"$version\"" plugin/src/common/OpenRGBTAC75HEPlugin.cpp
          grep -q "\"Version\": \"$version\"" plugin/src/windows/OpenRGBTAC75HEPlugin.json
          grep -q "\"VersionStr\": \"$version\"" plugin/src/windows/OpenRGBTAC75HEPlugin.json

      - name: Clone OpenRGB release_1.1
        shell: bash
        run: |
          cd plugin/src/windows
          git clone --depth 1 --branch release_1.1 https://github.com/CalcProgrammer1/OpenRGB.git OpenRGB
          echo "OpenRGB commit: $(git -C OpenRGB rev-parse --short HEAD)"

      - name: Place JSON for moc
        shell: bash
        run: |
          cd plugin/src/windows
          cp -f OpenRGBTAC75HEPlugin.json ../common/

      - name: Build plugin (x64)
        shell: cmd
        run: |
          cd plugin\src\windows
          if exist build rmdir /s /q build
          mkdir build
          copy /Y OpenRGBTAC75HEPlugin.json build\
          cd build
          qmake ..\OpenRGBTAC75HEPlugin.pro -spec win32-msvc CONFIG+=release
          nmake

      - name: Inspect DLL
        shell: cmd
        run: |
          mkdir dist
          copy /Y plugin\bin\windows\OpenRGBTAC75HEPlugin.dll dist\
          copy /Y plugin\src\windows\OpenRGB\dependencies\hidapi-hotplug-win\x64\hidapi-hotplug.dll dist\
          dir dist
          if not exist dist\hidapi-hotplug.dll (
            echo [FAIL] hidapi-hotplug.dll is missing from dist
            exit /b 1
          )
          echo.
          echo === HEADERS ===
          dumpbin /headers dist\OpenRGBTAC75HEPlugin.dll | findstr /I "machine"
          dumpbin /headers dist\OpenRGBTAC75HEPlugin.dll | findstr /C:"machine (x64)" >nul
          if errorlevel 1 (
            echo [FAIL] DLL is not x64
            exit /b 1
          )
          echo.
          echo === METADATA ===
          findstr /I /C:"OpenRGBPluginAPIVersion" /C:"org.openrgb.tac75heplugin" dist\OpenRGBTAC75HEPlugin.dll >nul
          if errorlevel 1 (
            echo [FAIL] plugin metadata not found
            exit /b 1
          )
          echo.
          echo === DEPENDENTS ===
          dumpbin /dependents dist\OpenRGBTAC75HEPlugin.dll
          dumpbin /dependents dist\OpenRGBTAC75HEPlugin.dll | findstr /I "hidapi-hotplug.dll" >nul
          if errorlevel 1 (
            echo [FAIL] plugin is not linked against hidapi-hotplug.dll
            exit /b 1
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBTAC75HEPlugin-windows-x86_64-qt6.8.3
          path: dist/
          if-no-files-found: error
