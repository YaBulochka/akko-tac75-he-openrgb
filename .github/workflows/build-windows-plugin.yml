name: Build Windows Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-windows-plugin.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone OpenRGB release_1.0
        shell: bash
        run: |
          cd plugin/src/windows
          git clone --depth 1 --branch release_1.0 https://github.com/CalcProgrammer1/OpenRGB.git OpenRGB
          echo "OpenRGB commit: $(git -C OpenRGB rev-parse --short HEAD)"

      - name: Place JSON for moc
        shell: bash
        run: |
          cd plugin/src/windows
          cp -f OpenRGBTAC75HEPlugin.json ../common/

      - name: Build plugin (x64)
        shell: cmd
        run: |
          cd plugin\src\windows
          if exist build rmdir /s /q build
          mkdir build
          copy /Y OpenRGBTAC75HEPlugin.json build\
          cd build
          qmake ..\OpenRGBTAC75HEPlugin.pro -spec win32-msvc CONFIG+=release
          nmake

      - name: Inspect DLL
        shell: cmd
        run: |
          mkdir dist
          for /r plugin %%f in (OpenRGBTAC75HEPlugin.dll) do (
            echo Found: %%f
            copy /Y "%%f" dist\
          )
          for /r plugin\src\windows\OpenRGB\dependencies\hidapi-win %%f in (hidapi.dll) do copy /Y "%%f" dist\
          dir dist
          echo.
          echo === FILE TYPE / HEADERS ===
          dumpbin /headers dist\OpenRGBTAC75HEPlugin.dll | findstr /I "machine abstract"
          echo.
          echo === DEPENDENTS ===
          dumpbin /dependents dist\OpenRGBTAC75HEPlugin.dll
          echo.
          echo === METADATA ===
          findstr /I /C:"OpenRGBPluginAPIVersion" /C:"org.openrgb.tac75heplugin" /C:"Akko TAC75" dist\OpenRGBTAC75HEPlugin.dll || echo metadata strings not found

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBTAC75HEPlugin-windows
          path: dist/
          if-no-files-found: error
